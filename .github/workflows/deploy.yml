name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fail here rather than shipping a bundle with undefined config, which
      # used to surface as a blank page with no error.
      # These must be REPOSITORY variables (Settings > Secrets and variables >
      # Actions > Variables). Environment-scoped variables are not visible to
      # this job, because it declares no `environment:`.
      - name: Check required variables
        run: |
          missing=0
          for v in VITE_APPWRITE_ENDPOINT VITE_APPWRITE_PROJECT; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v is not set"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "endpoint=$VITE_APPWRITE_ENDPOINT  project=$VITE_APPWRITE_PROJECT"
        env:
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT: ${{ vars.VITE_APPWRITE_PROJECT }}

      # A project site lives at /<repo>/ , not at the domain root.
      # Without this the bundle 404s in production but works locally.
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT: ${{ vars.VITE_APPWRITE_PROJECT }}
          VITE_APPWRITE_DB: ${{ vars.VITE_APPWRITE_DB }}
          VITE_MOCK: ${{ vars.VITE_MOCK }}
        run: npm run build

      # Pages has no rewrite rules, so a refresh on any sub-path would 404.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
